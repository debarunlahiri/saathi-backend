server:
  port: 8093
spring:
  application:
    name: saathi-complaint-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${COMPLAINT_DB_URL:jdbc:postgresql://localhost:5432/saathi_complaint}
    username: ${POSTGRES_USER:saathi}
    password: ${POSTGRES_PASSWORD:saathi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
