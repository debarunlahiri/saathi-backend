server:
  port: 8086
spring:
  application:
    name: saathi-pricing-service
  datasource:
    url: ${PRICING_DB_URL:jdbc:postgresql://localhost:5432/saathi_pricing}
    username: ${POSTGRES_USER:saathi}
    password: ${POSTGRES_PASSWORD:saathi}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
