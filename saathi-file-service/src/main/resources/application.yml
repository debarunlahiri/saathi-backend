server:
  port: 8092
spring:
  application:
    name: saathi-file-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${FILE_DB_URL:jdbc:postgresql://localhost:5432/saathi_file}
    username: ${POSTGRES_USER:saathi}
    password: ${POSTGRES_PASSWORD:saathi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
saathi:
  file:
    storage-root: ${FILE_STORAGE_ROOT:./data/files}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:ap-south-1}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
